<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pixy</title>
<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: system-ui, 'Segoe UI', 'Helvetica Neue', 'Inter', Arial, sans-serif;
}

body{
    background: #f8f9fc;
    scroll-behavior: smooth;
}

/* HEADER – сучасний, з тінню та прозорістю */

header{
    background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(12px);
    padding: 16px 24px;
    border-bottom: 1px solid rgba(0,0,0,0.05);
    position:sticky;
    top:0;
    z-index:100;
    transition: all 0.2s ease;
}

.header-container{
    max-width:1200px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap: wrap;
    gap: 16px;
}

.logo{
    font-size:26px;
    font-weight:800;
    background: linear-gradient(135deg, #f43f5e, #e11d48);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    letter-spacing: -0.3px;
    transition: transform 0.2s;
}

.logo:hover {
    transform: scale(1.02);
}

.menu{
    display:flex;
    gap:28px;
}

.menu a{
    text-decoration:none;
    font-weight:600;
    color:#1e293b;
    font-size:0.95rem;
    transition:0.2s;
    padding:4px 0;
    border-bottom: 2px solid transparent;
}

.menu a:hover{
    color:#e11d48;
    border-bottom-color: #e11d48;
}

/* Секція профілю – гнучка, більш сучасна */

.profile{
    max-width:1100px;
    margin:40px auto 20px;
    display:flex;
    align-items: center;
    gap: 48px;
    padding: 20px 28px;
    background: white;
    border-radius: 48px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.03);
    flex-wrap: wrap;
    justify-content: center;
}

.avatar{
    width:140px;
    height:140px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid white;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1), 0 0 0 3px #ff2e63;
    transition: transform 0.25s ease;
}

.avatar:hover {
    transform: scale(1.02);
}

.profile-info{
    flex: 1;
    min-width: 200px;
}

.profile-info h1{
    font-size: 1.9rem;
    font-weight: 700;
    background: linear-gradient(to right, #1e293b, #2d3a4f);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    margin-bottom: 12px;
}

.stats{
    display:flex;
    gap:32px;
    margin:18px 0 12px;
}

.stats p{
    font-size: 1rem;
    background: #f1f5f9;
    padding: 6px 16px;
    border-radius: 60px;
    font-weight: 500;
}

.stats b {
    font-size: 1.25rem;
    margin-right: 6px;
    color: #0f172a;
}

.profile-info p:last-of-type {
    font-size: 0.95rem;
    color: #334155;
    padding-top: 6px;
    border-top: 1px solid #e9eef3;
    display: inline-block;
}

/* GALLERY – стильна сітка з підтримкою різних форматів */
.gallery{
    max-width: 1200px;
    margin: 40px auto;
    padding: 0 24px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    grid-auto-flow: dense;
    gap: 24px;
    align-items: start;
}

/* CARD */
.photo{
    position: relative;
    background: white;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 10px 18px -6px rgba(0,0,0,0.08);
    transition: 0.3s;
    display: flex;
    flex-direction: column;
    height: auto;
    cursor: pointer;
}

.photo:hover{
    transform: translateY(-6px);
    box-shadow: 0 22px 28px -12px rgba(0,0,0,0.2);
}

/* IMAGE – адаптивна висота */
.photo img{
    width: 100%;
    display: block;
    object-fit: cover;
    transition: 0.5s ease;
    aspect-ratio: 1 / 1;
}

/* Спеціальні класи для різних пропорцій зображень */
.photo.big img{
    aspect-ratio: 16 / 9;
}

.photo.tall img{
    aspect-ratio: 3 / 4;
}

/* Унікальні висоти для контейнерів — гнучка адаптація */
.photo.big,
.photo.tall,
.photo {
    height: auto;
}

.likes{
    padding: 14px 18px;
    font-size: 0.95rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
    background: white;
    border-top: 1px solid #f0f2f5;
    letter-spacing: -0.2px;
}

.likes::before {
    content: "❤️";
    font-size: 1.2rem;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.1));
}

/* GRID SPANS – керування позиціями */
.big{
    grid-column: span 2;
}

.tall{
    grid-row: span 2;
}

/* Адаптив для планшетів */
@media (max-width: 780px){
    .big{
        grid-column: span 1;
    }
    .tall{
        grid-row: span 1;
    }
}

/* Додатковий адаптив для маленьких екранів */
@media (max-width: 640px) {
    .profile {
        gap: 20px;
        padding: 20px;
        border-radius: 36px;
        margin: 20px 16px;
    }
    
    .avatar {
        width: 100px;
        height: 100px;
    }
    
    .stats {
        gap: 12px;
        flex-wrap: wrap;
    }
    
    .stats p {
        font-size: 0.8rem;
        padding: 4px 12px;
    }
    
    .gallery {
        padding: 0 16px;
        gap: 16px;
    }
    
    .logo {
        font-size: 22px;
    }
}

/* Мікроінтеракція для лайків */
.photo .likes {
    transition: background 0.2s;
}

.photo:hover .likes {
    background: #fff7f5;
}

/* FOOTER */
footer{
    text-align:center;
    padding: 36px 20px;
    color:#64748b;
    font-size: 0.8rem;
    border-top: 1px solid #eef2f6;
    background: white;
    margin-top: 40px;
    letter-spacing: 0.3px;
}

.menu a:active {
    transform: scale(0.96);
}

.profile-info p b {
    font-size: 1.2rem;
    background: none;
    padding: 0;
}

/* Анімація появи */
@keyframes fadeSlide {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.gallery .photo {
    animation: fadeSlide 0.4s ease-out forwards;
    opacity: 0;
}

.gallery .photo:nth-child(1) { animation-delay: 0.02s; }
.gallery .photo:nth-child(2) { animation-delay: 0.05s; }
.gallery .photo:nth-child(3) { animation-delay: 0.09s; }
.gallery .photo:nth-child(4) { animation-delay: 0.12s; }
.gallery .photo:nth-child(5) { animation-delay: 0.15s; }
.gallery .photo:nth-child(6) { animation-delay: 0.18s; }
.gallery .photo:nth-child(7) { animation-delay: 0.21s; }

/* Стилізація скролу */
::-webkit-scrollbar {
    width: 5px;
    height: 5px;
}
::-webkit-scrollbar-track {
    background: #f1f1f1;
    border-radius: 10px;
}
::-webkit-scrollbar-thumb {
    background: #ff2e63;
    border-radius: 10px;
}

/* Запасний стиль для зображень, якщо вони не завантажились */
img {
    background: #f0f2f5;
}
</style>
</head>
